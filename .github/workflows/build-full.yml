name: Build full CPU container

on:
  workflow_dispatch:
  push:
    branches:
      - "full-cpu"

permissions:
  contents: read
  packages: write

concurrency:
  group: full-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: recoll-container:full-cpu-${{ matrix.arch }}
          cache-from: type=gha,scope=full-cpu-test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=full-cpu-test-${{ matrix.arch }}

      - name: Runtime dependency checks
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh \
            "recoll-container:full-cpu-${{ matrix.arch }}" \
            -ec '
              /usr/local/libexec/recoll-container/whisper-selftest.py

              tesseract --list-langs >/dev/null

              dpkg-query -W tesseract-ocr-all >/dev/null

              printf "hello\nworld\n" \
                | aspell \
                    --lang=en \
                    --encoding=utf-8 \
                    create master \
                    /tmp/aspell-en-ci.rws

              test -s /tmp/aspell-en-ci.rws
              rm -f /tmp/aspell-en-ci.rws

              ffmpeg -version >/dev/null
              whisper --help >/dev/null
            '

      - name: Report image size
        shell: bash
        run: |
          set -euo pipefail
          bytes="$(
            docker image inspect \
              "recoll-container:full-cpu-${{ matrix.arch }}" \
              --format '{{.Size}}'
          )"
          mib="$((bytes / 1024 / 1024))"
          printf 'full-cpu %s image size: %s MiB\n' \
            '${{ matrix.arch }}' \
            "${mib}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare official tiny model and audio sample
        shell: bash
        run: |
          set -euo pipefail

          model_dir="${PWD}/.ci-whisper"
          mkdir -p "${model_dir}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://openaipublic.azureedge.net/main/whisper/models/65147644a518d12f04e32d6f3b26facc3f8dd46e5390956a9424a650c0ce22b9/tiny.pt" \
            --output "${model_dir}/tiny.pt"

          printf '%s  %s\n' \
            '65147644a518d12f04e32d6f3b26facc3f8dd46e5390956a9424a650c0ce22b9' \
            "${model_dir}/tiny.pt" \
            | sha256sum -c -

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://raw.githubusercontent.com/openai/whisper/v20250625/tests/jfk.flac" \
            --output "${PWD}/.ci-jfk.flac"

      - name: Run real Whisper CPU transcription
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --network none \
            --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh \
            --env WHISPER_ALLOW_DOWNLOAD=0 \
            --env WHISPER_MODEL_DIR=/recoll/models/whisper \
            --env OMP_NUM_THREADS=1 \
            --env MKL_NUM_THREADS=1 \
            --env NUMBA_NUM_THREADS=1 \
            --env OPENBLAS_NUM_THREADS=1 \
            --volume "${PWD}/.ci-whisper:/recoll/models/whisper:ro" \
            --volume "${PWD}/.ci-jfk.flac:/tmp/jfk.flac:ro" \
            "recoll-container:full-cpu-${{ matrix.arch }}" \
            -ec '
              timeout 30m python3 - <<"PY"
          import whisper

          model = whisper.load_model(
              "tiny",
              device="cpu",
          )

          result = model.transcribe(
              "/tmp/jfk.flac",
              language="en",
              fp16=False,
          )

          text = result.get("text", "").strip()
          if not text:
              raise RuntimeError(
                  "Whisper CPU transcription returned empty text"
              )

          print(text)
          PY
            '

  publish:
    name: Publish full-cpu
    if: github.ref == 'refs/heads/full-cpu'
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full-cpu
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:full-cpu
          labels: |
            org.opencontainers.image.title=recoll-container
            org.opencontainers.image.description=Recoll 1.44.1 full CPU image with all Tesseract languages, OpenAI Whisper and Aspell English dictionary
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=full-cpu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=full-cpu-publish
          cache-to: type=gha,mode=max,scope=full-cpu-publish
